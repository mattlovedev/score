{{define "cribbage"}}
<div id="content" class="text-center">

<script>
    function makeIncr(player, increment) {
        return {
            gameId: "{{ .Id }}",
            player,
            increment
        }
    }

    // Used to confirm taps that would end the game. var, not const: htmx re-runs
    // this script on every swap, and a top-level const can't be redeclared.
    var game = {
        scores: [{{ (index .Players 0).Score }}, {{ (index .Players 1).Score }}],
        names: [{{ (index .Players 0).Name }}, {{ (index .Players 1).Name }}],
        max: {{ .MaxScore }}
    }

    function escapeAttr(s) {
        return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    }
</script>

    <div class="text-start">
        <a href="/" class="btn btn-sm btn-outline-secondary">Home</a>
    </div>

    <div class="row">
        <div class="col">
            <div>
                <span class="h1">
                    {{ (index .Players 0).Score }}
                </span>
                <span class="h6">
                    / {{ .MaxScore }}
                </span>
            </div>
            <div class="h5">
                {{ (index .Players 0).Name }}
            </div>
            <div id="p0-buttons"></div>
        </div>
        <div class="col">
            <div>
                <span class="h1">
                    {{ (index .Players 1).Score }}
                </span>
                <span class="h6">
                    / {{ .MaxScore }}
                </span>
            </div>
            <div class="h5">
                {{ (index .Players 1).Name }}
            </div>
            <div id="p1-buttons"></div>
        </div>
    </div>

<script>
    function makeButton(player, increment) {
        const sign = (increment > 0) ? "+" : ""
        const cl = (increment > 0) ? "btn-success" : "btn-danger"
        let confirm = ""
        if (increment > 0 && game.scores[player] + increment >= game.max) {
            const other = 1 - player
            confirm = ' hx-confirm="' + escapeAttr("End the game? " + game.names[player] + " wins " +
                game.max + "–" + game.scores[other] + ".") + '"'
        }
        return '<button type="button" class="btn ' + cl + '"' + confirm +
        ' hx-post="/score" hx-target="#content" hx-swap="outerHTML"' +
        'hx-vals="js:{...makeIncr(' + player + ', ' + increment + ')}">' +
            sign + increment.toString() + '</button>'
    }
    function makeButtonPair(player, increment) {
        return '<div>' + makeButton(player, increment) +
            makeButton(player, -1 * increment) + '</div>'
    }
    function makeButtons(player) {
        return makeButtonPair(player, 1) + makeButtonPair(player, 2) + makeButtonPair(player, 3) +
            makeButtonPair(player, 4) + makeButtonPair(player, 5) + makeButtonPair(player , 10) +
            makeButtonPair(player, 15)
    }
    document.getElementById("p0-buttons").innerHTML = makeButtons(0)
    document.getElementById("p1-buttons").innerHTML = makeButtons(1)
</script>

</div>
{{end}}
