<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.6/dist/htmx.min.js" crossorigin="anonymous"></script>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        div {
            margin-top: 20px;
        }
    </style>

    <script>
        let config = {
            game: null,
            "players[]": null
        }

        function makeRequest() {
            let players = [
                document.getElementById("p1-name").value,
                document.getElementById("p2-name").value
            ]
            if (config.players.textContent === "Three") {
                players.push(document.getElementById("p3-name").value)
            }
            if (config.players.textContent === "Four") {
                players.push(document.getElementById("p3-name").value)
                players.push(document.getElementById("p4-name").value)
            }
            return {
                game: config.game.textContent,
                players,
                max: document.getElementById("maxScore").value
            }
        }

        function startable() {
            if (config.game == null) {
                return false
            }
            if (document.getElementById("p1-name").value === "") {
                return false
            }
            if (document.getElementById("p2-name").value === "") {
                return false
            }
            if ((config.players.textContent === "Three" ||
                    config.players.textContent === "Four")
                && document.getElementById("p3-name").value === "") {
                return false
            }
            if (config.players.textContent === "Four" && document.getElementById("p4-name").value === "") {
                return false
            }
            return true
        }

        function setStartable() {
            if (startable()) {
                document.getElementById("startButton").disabled = false
            } else {
                document.getElementById("startButton").disabled = true
            }
        }


        function selectGame(e) {
            if (config.game != null) {
                config.game.classList.remove("active")
            }
            config.game = e.target
            e.target.classList.add("active")
            if (e.target.innerText === "Dominoes") {
                document.getElementById("maxScoreDiv").classList.remove("d-none")
            } else {
                document.getElementById("maxScoreDiv").classList.add("d-none")
            }
            setStartable()
        }

        function selectPlayers(e) {

            config.players.classList.remove("active")
            config.players = e.target
            e.target.classList.add("active")

            document.getElementById("p3-name").classList.remove("d-none")
            document.getElementById("p4-name").classList.remove("d-none")

            if (e.target.textContent === "Two") {
                document.getElementById("p3-name").classList.add("d-none")
                document.getElementById("p4-name").classList.add("d-none")
            }
            if (e.target.textContent === "Three") {
                document.getElementById("p4-name").classList.add("d-none")
            }

            setStartable()
        }
    </script>
</head>
<body>

<div class="container">

    <div id="content">

        <div><p class="h3 text-center">Game:</p></div>

        <div class="d-flex">
            <button class="btn btn-outline-primary flex-fill" onclick="selectGame(event)">Cribbage</button>
            <button class="btn btn-outline-primary flex-fill" onclick="selectGame(event)">Dominoes</button>
        </div>

        <div id="maxScoreDiv" class="text-center row d-none" style="margin-top: 25px">
            <h3 class="col">Max Score:</h3>
            <select id="maxScore" class="form-select col">
                <option value="100">100</option>
                <option value="150">150</option>
                <option value="200">200</option>
                <option selected value="250">250</option>
            </select>
        </div>

        <div><p class="h3 text-center">Number of Players:</p></div>

        <div class="d-flex">
            <button class="btn btn-outline-primary flex-fill active" id="two-players" onclick="selectPlayers(event)">Two</button>
            <button class="btn btn-outline-primary flex-fill" onclick="selectPlayers(event)">Three</button>
            <button class="btn btn-outline-primary flex-fill" onclick="selectPlayers(event)">Four</button>
        </div>

        <script>
            config.players = document.getElementById("two-players")
        </script>

        <div><input type="text" class="form-control" placeholder="player one name" id="p1-name" oninput="setStartable()"></div>
        <div><input type="text" class="form-control" placeholder="player two name" id="p2-name" oninput="setStartable()"></div>
        <div><input type="text" class="form-control d-none" placeholder="player three name" id="p3-name" oninput="setStartable()"></div>
        <div><input type="text" class="form-control d-none" placeholder="player four name" id="p4-name" oninput="setStartable()"></div>

        <div class="text-center">
            <button disabled
                    id="startButton"
                    hx-post="/start"
                    hx-target="#content"
                    hx-swap="outerHTML"
                    hx-vals="js:{...makeRequest()}"
                    class="btn btn-primary">Start Game</button>
        </div>

        <div id="active-games">
            {{template "active-games" .Active}}
        </div>

        <div id="finished-games">
            {{template "finished-games" .Finished}}
        </div>

        <div id="players">
            {{template "players" .Players}}
        </div>

    </div>

</div>

</body>
</html>
