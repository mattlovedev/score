{{define "active-games"}}
{{if len .}}
<div class="h3 text-center">
    Active Games
</div>
<table class="table">
    <thead>
    <th>Date</th>
    <th>Game</th>
    <th>Players</th>
    <th>Actions</th>
    </thead>
    <tbody>
    {{range .}}
    <tr>
        <td>{{.Date.Format "Jan 02 03:04 PM"}}</td>
        <td>{{.Type}} / {{.MaxScore}}</td>
        <td>
            {{(index .Players 0).Name}}
            ({{(index .Players 0).Score}}) -
            {{(index .Players 1).Name}}
            ({{(index .Players 1).Score}})
        </td>
        <td>
            <button hx-post="/continue"
                    hx-target="#content"
                    hx-swap="outerHTML"
                    hx-vals='{"gameId": "{{.Id}}"}'
                    class="btn btn-primary">Continue</button>
            <button hx-post="/delete"
                    hx-target="#active-games"
                    hx-swap="innerHTML"
                    hx-vals='{"gameId": "{{.Id}}"}'
                    hx-confirm="Delete this {{.Type}} game? {{(index .Players 0).Name}} {{(index .Players 0).Score}} – {{(index .Players 1).Name}} {{(index .Players 1).Score}}"
                    class="btn btn-outline-danger">Delete</button>
        </td>
    </tr>
    {{end}}
    </tbody>
</table>
{{end}}
{{end}}
